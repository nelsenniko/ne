
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#7048ff">
    <meta name="description" content="Nelsen SHOP - Diamond game, pulsa, listrik dan produk digital">
    <title>Nelsen SHOP</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg">

<style type="text/css" media="all">
    
:root {
    color-scheme: dark;

    --bg: #0b0914;
    --bg-glow: #17102c;
    --surface: rgba(27, 23, 45, 0.92);
    --surface-soft: #211b35;
    --surface-hover: #2a2243;

    --primary: #8057ff;
    --primary-light: #a58aff;
    --primary-dark: #6138e8;

    --text: #f8f6ff;
    --text-secondary: #b7afce;
    --text-muted: #89819f;

    --border: rgba(181, 158, 255, 0.17);
    --success: #55dfad;
    --danger: #ff7d91;

    --radius-lg: 18px;
    --radius-xl: 24px;

    --shadow-card:
        0 24px 70px rgba(0, 0, 0, 0.35);

    --transition:
        180ms ease;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 28px 18px;

    display: grid;
    place-items: center;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(112, 72, 255, 0.19),
            transparent 52%
        ),
        radial-gradient(
            ellipse at 0% 100%,
            rgba(90, 50, 180, 0.10),
            transparent 45%
        ),
        var(--bg);

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;

    background-image:
        linear-gradient(
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
        );

    background-size: 36px 36px;
    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}

main {
    position: relative;
    isolation: isolate;

    width: 100%;
    max-width: 440px;
    min-width: 0;

    padding: 30px 26px 22px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);

    box-shadow: var(--shadow-card);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation: card-enter 450ms ease both;
}

.logo {
    width: fit-content;
    min-width: 66px;
    min-height: 58px;
    padding: 0 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            #9878ff,
            #7048ff 55%,
            #5932d4
        );

    color: #fff;

    font-size: 14px;
    font-weight: 850;
    letter-spacing: 0.08em;

    box-shadow:
        0 8px 26px rgba(112, 72, 255, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

h1 {
    margin: 22px 0 10px;

    font-size: clamp(25px, 6vw, 32px);
    line-height: 1.2;
    letter-spacing: -0.045em;
    font-weight: 800;
}

p {
    margin: 18px 0 24px;

    color: var(--text-secondary);

    font-size: 14px;
    line-height: 1.85;
    letter-spacing: 0.005em;
}

.button {
    position: relative;
    isolation: isolate;
    overflow: hidden;

    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    padding: 15px 18px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    border: 1px solid transparent;
    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            var(--primary-light),
            var(--primary) 48%,
            var(--primary-dark)
        );

    color: #fff;

    text-align: center;
    text-decoration: none;

    font: inherit;
    font-size: 14px;
    font-weight: 750;
    line-height: 1.4;
    letter-spacing: 0.005em;

    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

    box-shadow:
        0 9px 24px rgba(112, 72, 255, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition),
        background var(--transition);
}

.button:hover {
    box-shadow:
        0 12px 30px rgba(112, 72, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);

    transform: translateY(-1px);
}

.button:active {
    transform: scale(0.985);
}

.button:focus-visible {
    outline: 3px solid var(--primary-light);
    outline-offset: 4px;
}

.button.install {
    color: #e7ddff;

    background:
        linear-gradient(
            145deg,
            rgba(133, 95, 255, 0.15),
            rgba(65, 47, 105, 0.28)
        );

    border-color: rgba(165, 138, 255, 0.48);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

    animation: install-enter 250ms ease both;
}

.button.install:hover {
    background: var(--surface-hover);
    border-color: var(--primary-light);
}

.button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

[hidden] {
    display: none !important;
}

#status {
    position: relative;

    min-width: 0;
    margin-top: 20px;
    padding: 13px 14px 13px 38px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: rgba(255, 255, 255, 0.025);

    color: var(--text-secondary);

    font-size: 12px;
    line-height: 1.75;
    overflow-wrap: anywhere;
}

#status::before {
    content: "";
    position: absolute;

    top: 19px;
    left: 15px;

    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: var(--success);

    box-shadow:
        0 0 0 4px rgba(85, 223, 173, 0.10);
}

/* Gunakan class ini jika status perlu menampilkan error. */
#status.error {
    color: #ffc1cb;
    border-color: rgba(255, 125, 145, 0.3);
    background: rgba(255, 125, 145, 0.06);
}

#status.error::before {
    background: var(--danger);
    box-shadow:
        0 0 0 4px rgba(255, 125, 145, 0.10);
}

/* Status proses memuat. */
#status.loading::before {
    background: var(--primary-light);
    box-shadow: none;
    animation: status-pulse 1.2s ease-in-out infinite;
}

/* Status offline. */
#status.offline::before {
    background: #e8b66c;
    box-shadow: none;
}

footer {
    margin-top: 24px;
    padding-top: 17px;

    border-top: 1px solid rgba(181, 158, 255, 0.10);

    color: var(--text-muted);

    text-align: center;
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.035em;
}

button,
a {
    -webkit-user-select: none;
    user-select: none;
}

@keyframes card-enter {
    from {
        opacity: 0;
        transform: translateY(9px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes install-enter {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes status-pulse {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}

@media (max-width: 480px) {
    body {
        padding: 18px 14px;
    }

    main {
        padding: 25px 20px 19px;
        border-radius: 22px;
    }

    .logo {
        min-height: 54px;
        border-radius: 17px;
    }

    p {
        margin: 16px 0 21px;
        font-size: 13.5px;
    }

    .button {
        min-height: 50px;
        padding: 14px;
        border-radius: 14px;
    }

    #status {
        margin-top: 17px;
    }
}

@media (max-width: 350px) {
    body {
        padding: 12px 9px;
    }

    main {
        padding: 21px 15px 17px;
    }

    .button {
        font-size: 13px;
    }
}

@media (min-width: 700px) {
    body {
        padding: 40px 24px;
    }

    main {
        padding: 34px 30px 25px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>

<body>
    <main>
        <div class="logo">NELSHOP</div>

        <p>
            Beli diamond game, token listrik, pulsa,
            dan produk digital lainnya dengan mudah.
        </p>

        <!-- Tombol install, hanya muncul jika memenuhi syarat -->
        <button
            id="installButton"
            class="button install"
            type="button"
            hidden
        >
            ⬇ Install Nelsen SHOP
        </button>

        <!-- Tombol lanjut ke toko -->
        <a
            id="continueButton"
            class="button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Lanjutkan (3)
        </a>

        <div id="status" role="status" aria-live="polite">
            Menyiapkan aplikasi...
        </div>

        <footer>Nelsen SHOP · Digital Store</footer>
    </main>

    <script>
    (() => {
        "use strict";
        
        

        const status = document.querySelector("#status");
        const installButton = document.querySelector("#installButton");
        const continueButton = document.querySelector("#continueButton");

        let installPrompt = null;
        let countdownTimer = null;
        let countdown = 3;
        let installed = false;

        // Deteksi apakah aplikasi berjalan sebagai PWA terpasang.
        function isAppInstalled() {
            return window.matchMedia("(display-mode: standalone)").matches
                || window.matchMedia("(display-mode: fullscreen)").matches
                || window.navigator.standalone === true;
        }

        function hideInstallButton() {
            installButton.hidden = true;
        }

        function stopCountdown() {
            if (countdownTimer !== null) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        // PWA sudah terpasang: tombol install tidak diperlukan.
        function checkInstalled() {
            if (isAppInstalled() || installed) {
                hideInstallButton();
                stopCountdown();
                return true;
            }

            return false;
        }

        // Browser mengizinkan instalasi.
        window.addEventListener("beforeinstallprompt", (event) => {
            event.preventDefault();

            if (checkInstalled()) return;

            installPrompt = event;
            installButton.hidden = false;
            status.textContent =
                "Aplikasi siap dipasang di perangkat Anda.";
        });

        // Tombol install ditekan.
        installButton.addEventListener("click", async () => {
            if (!installPrompt) {
                status.textContent =
                    "Gunakan menu browser, lalu pilih Tambahkan ke layar utama atau Install aplikasi.";
                return;
            }

            const promptEvent = installPrompt;
            installPrompt = null;
            hideInstallButton();

            try {
                await promptEvent.prompt();

                const result = await promptEvent.userChoice;

                if (result.outcome === "accepted") {
                    status.textContent =
                        "Instalasi dipilih. Menunggu konfirmasi browser...";
                } else {
                    status.textContent =
                        "Instalasi dibatalkan. Anda masih dapat membuka toko.";
                }
            } catch (error) {
                status.textContent =
                    "Instalasi gagal. Coba melalui menu browser.";
            }
        });

        // Browser mengonfirmasi aplikasi telah terpasang.
        window.addEventListener("appinstalled", () => {
            installed = true;
            hideInstallButton();
            stopCountdown();

            status.textContent = "Nelsen SHOP berhasil dipasang.";
        });

        // Status koneksi.
        function updateStatus() {
            if (checkInstalled()) {
                status.textContent =
                    navigator.onLine
                        ? "Aplikasi terpasang · Online"
                        : "Aplikasi terpasang · Offline";
                return;
            }

            if (!installPrompt) {
                status.textContent = navigator.onLine
                    ? "Online · Memeriksa pembaruan aplikasi"
                    : "Offline · Halaman tersimpan mungkin masih tersedia";
            }
        }

        window.addEventListener("online", updateStatus);
        window.addEventListener("offline", updateStatus);

        // Browser yang sudah terpasang tidak menampilkan tombol install.
        checkInstalled();

        // Countdown redirect 3 detik.
        // Countdown dihentikan ketika pengguna memilih install.
        if (!isAppInstalled()) {
            countdownTimer = setInterval(() => {
                if (checkInstalled() || installPrompt) {
                    stopCountdown();
                    return;
                }

                countdown--;

                if (countdown > 0) {
                    continueButton.textContent =
                        `Lanjutkan (${countdown})`;
                } else {
                    stopCountdown();

                    // URL statis saat ini.
                    window.location.replace(
                        continueButton.href
                    );
                }
            }, 1000);
        }

        // Registrasi dan pemeriksaan Service Worker.
        if ("serviceWorker" in navigator &&
            location.protocol !== "file:") {

            navigator.serviceWorker.register("./sw.js")
                .then((registration) => {
                    updateStatus();

                    const checkUpdate = async () => {
                        if (!navigator.onLine) return;

                        try {
                            await registration.update();
                        } catch (error) {
                            console.log(
                                "Pemeriksaan pembaruan gagal."
                            );
                        }
                    };

                    checkUpdate();
                    setInterval(checkUpdate, 60000);

                    let reloading = false;

                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        () => {
                            if (reloading) return;
                            reloading = true;
                            location.reload();
                        }
                    );
                })
               .catch((error) => {
    console.error(
        "Registrasi Service Worker gagal:",
        error
    );

    // Jangan tampilkan error teknis kepada pembeli.
    // Halaman toko tetap dapat digunakan.
});
        } else {
            status.textContent =
                "Gunakan HTTPS atau localhost untuk mengaktifkan PWA.";
        }
    })();
    </script>
</body>
</html>
