<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#7048ff">
    <meta name="description" content="Nelsen SHOP - Diamond game, pulsa, listrik dan produk digital">
    <title>Nelsen SHOP</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg">

    <style>
        * {
            box-sizing: border-box
        }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: grid;
            place-items: center;
            font-family: system-ui,sans-serif;
            background: #10101b;
            color: #fff
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: #1b1a2b;
            border: 1px solid #34304c;
            border-radius: 24px
        }
        .logo {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #7048ff;
            font-size: 28px;
            font-weight: 800
        }
        h1 {
            margin-bottom: 8px
        }
        p {
            color: #bcb8d0;
            line-height: 1.7
        }
        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 0;
            border-radius: 12px;
            background: #7048ff;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer
        }
        #status {
            font-size: 13px;
            background: #29273c;
            padding: 12px;
            border-radius: 10px;
            margin-top: 18px
        }
        footer {
            font-size: 12px;
            color: #928ca9;
            text-align: center;
            margin-top: 20px
        }
    </style>
</head>
<body>
    <main>
        <div class="logo">
            N
        </div>
        <h1>NELSEHOP</h1>
        <p>
            Beli diamond game, token listrik, pulsa, dan produk digital lainnya dengan mudah.
        </p>

        <!-- Ganti ./shop/ dengan alamat halaman toko sebenarnya -->

        <a
            class="button"
            href="https://www.nelsenjek.com"
            target="_blank"
            rel="noopener noreferrer"
            >
            Lanjutkan -->
        </a>

        <div id="status" role="status" aria-live="polite">
            Menyiapkan aplikasi...
        </div>

        <footer>
            Nelsen SHOP · Digital Store
        </footer>
    </main>

    <script>
        (() => {
            const status = document.querySelector("#status");

            function updateStatus() {
                status.textContent = navigator.onLine
                ? "Online · Pembaruan otomatis aktif": "Offline · Membuka halaman tersimpan jika tersedia";
            }

            window.addEventListener("online", updateStatus);
            window.addEventListener("offline", updateStatus);

            if ("serviceWorker" in navigator &&
                location.protocol !== "file:") {
                navigator.serviceWorker.register("./sw.js")
                .then(registration => {
                    updateStatus();

                    // Periksa apakah service worker di server berubah.
                    const checkUpdate = async () => {
                        if (!navigator.onLine) return;

                        try {
                            await registration.update();
                        } catch (error) {
                            console.log("Pemeriksaan pembaruan gagal.");
                        }
                    };

                    checkUpdate();
                    setInterval(checkUpdate, 10000);

                    // Ketika versi baru aktif, muat ulang halaman satu kali.
                    let reloading = false;

                    navigator.serviceWorker.addEventListener(
                        "controllerchange", () => {
                            if (reloading) return;
                            reloading = true;
                            location.reload();
                        }
                    );
                })
                .catch(() => {
                    status.textContent = "PWA belum aktif. Periksa koneksi server.";
                });
            } else {
                status.textContent =
                "Gunakan HTTPS atau localhost untuk mengaktifkan PWA.";
            }
        })();
    </script>
</body>
</html>
